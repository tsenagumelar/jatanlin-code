services:
  jtn-web:
    image: taufansena/jtn-web:latest
    container_name: jtn-web-new
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_HASURA_URL: "http://localhost:8080/v1/graphql"
      NEXT_PUBLIC_HASURA_WS_IP: "ws://localhost:8080/v1/graphql"
      NEXT_PUBLIC_HASURA_SECRET: change-me-admin-secret
      NEXT_PUBLIC_API_URL: "http://localhost:24000"
      NEXT_PUBLIC_MINIO_URL: "http://51.79.173.213:9000"
    ports:
      - target: 3000
        published: 23000
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jtn-api:
    image: taufansena/jtn-api-service:latest
    container_name: jtn-api-new
    restart: unless-stopped
    environment:
      SERVICE: api
      SITE_CODE: MST-25-00001
      SITE_NAME: Mampang
      SITE_LOCATION: Jakarta Selatan
      SITE_REGION: JABODETABEK

      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5432/jatanlin?sslmode=disable"
      API_PORT: "4000"
      JWT_SECRET: super-secret-jwt
      AUTH_ENABLED: "true"
      NATS_URL: "nats://nats:natspass@host.docker.internal:4222"

      ANPR_FTP_HOST: "host.docker.internal:21"
      ANPR_FTP_USER: ftpuser
      ANPR_FTP_PASS: ftppass
      ANPR_FTP_DIR: /anpr
      ANPR_FTP_INTERVAL_SEC: "5"

      AXLE_FTP_HOST: "host.docker.internal:21"
      AXLE_FTP_USER: ftpuser
      AXLE_FTP_PASS: ftppass
      AXLE_FTP_DIR: /axle
      AXLE_FTP_INTERVAL_SEC: "5"

      ANPR_MINIO_ENDPOINT: "51.79.173.213:9000"
      ANPR_MINIO_ACCESS_KEY: minioadmin
      ANPR_MINIO_SECRET_KEY: minioadmin123
      ANPR_MINIO_BUCKET: anpr
      ANPR_MINIO_USE_SSL: "false"

      AXLE_MINIO_ENDPOINT: "51.79.173.213:9000"
      AXLE_MINIO_ACCESS_KEY: minioadmin
      AXLE_MINIO_SECRET_KEY: minioadmin123
      AXLE_MINIO_BUCKET: axle
      AXLE_MINIO_USE_SSL: "false"

      ATTACHMENT_MINIO_ENDPOINT: "51.79.173.213:9000"
      ATTACHMENT_MINIO_ACCESS_KEY: minioadmin
      ATTACHMENT_MINIO_SECRET_KEY: minioadmin123
      ATTACHMENT_MINIO_BUCKET: attachment
      ATTACHMENT_MINIO_USE_SSL: "false"

      DIMENSION_ENABLED: "true"
      RTSP_URL: rtsp://admin:admin@192.168.1.18:554/live.sdp
      WEIGHING_TRIGGER_URL: "http://jtn-wb:5000/ws/wim/anpr-capture"
      WEIGHING_TRIGGER_DUMMY: "true"
      CCTV_TRIGGER_URL: "http://jtn-cctv:8090/record"
      CCTV_TRIGGER_DUMMY: "true"
    ports:
      - target: 4000
        published: 24000
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jtn-anpr:
    image: taufansena/jtn-anpr-service:latest
    container_name: jtn-anpr-new
    restart: unless-stopped
    depends_on:
      - jtn-api
    environment:
      SERVICE: anpr-watcher
      SITE_CODE: MST-25-00001
      SITE_NAME: Mampang
      SITE_LOCATION: Jakarta Selatan
      SITE_REGION: JABODETABEK
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5432/jatanlin?sslmode=disable"
      JWT_SECRET: super-secret-jwt
      NATS_URL: "nats://nats:natspass@host.docker.internal:4222"

      ANPR_FTP_HOST: "host.docker.internal:21"
      ANPR_FTP_USER: ftpuser
      ANPR_FTP_PASS: ftppass
      ANPR_FTP_DIR: /anpr
      ANPR_FTP_INTERVAL_SEC: "5"
      ANPR_DUMMY_ENABLED: "true"

      ANPR_MINIO_ENDPOINT: "51.79.173.213:9000"
      ANPR_MINIO_ACCESS_KEY: minioadmin
      ANPR_MINIO_SECRET_KEY: minioadmin123
      ANPR_MINIO_BUCKET: anpr
      ANPR_MINIO_USE_SSL: "false"

      DIMENSION_ENABLED: "true"
      WEIGHING_TRIGGER_URL: "http://jtn-wb:5000/ws/wim/anpr-capture"
      WEIGHING_TRIGGER_DUMMY: "true"
      CCTV_TRIGGER_URL: "http://jtn-cctv:8090/record"
      CCTV_TRIGGER_DUMMY: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jtn-axle:
    image: taufansena/jtn-axle-service:latest
    container_name: jtn-axle-new
    restart: unless-stopped
    depends_on:
      - jtn-api
    environment:
      SERVICE: axle-watcher
      SITE_CODE: MST-25-00001
      SITE_NAME: Mampang
      SITE_LOCATION: Jakarta Selatan
      SITE_REGION: JABODETABEK
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5432/jatanlin?sslmode=disable"
      JWT_SECRET: super-secret-jwt
      NATS_URL: "nats://nats:natspass@host.docker.internal:4222"

      AXLE_FTP_HOST: "host.docker.internal:21"
      AXLE_FTP_USER: ftpuser
      AXLE_FTP_PASS: ftppass
      AXLE_FTP_DIR: /axle
      AXLE_FTP_INTERVAL_SEC: "5"
      AXLE_DUMMY_ENABLED: "true"

      AXLE_MINIO_ENDPOINT: "51.79.173.213:9000"
      AXLE_MINIO_ACCESS_KEY: minioadmin
      AXLE_MINIO_SECRET_KEY: minioadmin123
      AXLE_MINIO_BUCKET: axle
      AXLE_MINIO_USE_SSL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jtn-cctv:
    image: taufansena/jtn-cctv-service:latest
    container_name: jtn-cctv-new
    restart: unless-stopped
    depends_on:
      - jtn-api
    environment:
      SERVICE: cctv-streamer
      SITE_CODE: MST-25-00001
      SITE_NAME: Mampang
      SITE_LOCATION: Jakarta Selatan
      SITE_REGION: JABODETABEK
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5432/jatanlin?sslmode=disable"
      JWT_SECRET: super-secret-jwt
      NATS_URL: "nats://nats:natspass@host.docker.internal:4222"
      RTSP_URL: rtsp://admin:admin@192.168.1.18:554/live.sdp
      CCTV_TRIGGER_DUMMY: "true"
      CCTV_HTTP_PORT: "8090"
      PORT: "8090"
    ports:
      - target: 8090
        published: 26090
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jtn-wb:
    image: taufansena/jtn-wb-service:latest
    container_name: jtn-wb-new
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__VehicleDatabase: "Host=host.docker.internal;Port=5432;Database=jatanlin;Username=postgres;Password=postgres"
      Nats__Url: "nats://nats:natspass@host.docker.internal:4222"
      SITE_CODE: MST-25-00001
      WB_DUMMY_ENABLED: "true"
      WB_SESSION_LISTENER_ENABLED: "true"
      WB_CAPTURE_TIMEOUT_SEC: "60"
      WB_CAPTURE_DIRECTION: "RIGHT"
    ports:
      - target: 5000
        published: 25000
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
