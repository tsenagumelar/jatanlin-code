services:
  jtn-api:
    image: taufansena/jtn-api-service:latest
    container_name: jtn-api-new
    restart: unless-stopped
    environment:
      SERVICE: api
      SITE_CODE: MST-25-00001
      SITE_NAME: Mampang
      SITE_LOCATION: Central Office
      SITE_REGION: Default

      DATABASE_URL: "postgres://jatanlin:SuperSecretPasswordBang123@51.79.173.213:5432/jatanlin?sslmode=disable"
      API_PORT: "4000"
      JWT_SECRET: super-secret-jwt
      AUTH_ENABLED: "true"
      NATS_URL: "nats://nats:natspass@host.docker.internal:4222"

      ANPR_FTP_HOST: "host.docker.internal:21"
      ANPR_FTP_USER: ftpuser
      ANPR_FTP_PASS: ftppass
      ANPR_FTP_DIR: /anpr
      ANPR_FTP_INTERVAL_SEC: "5"

      AXLE_FTP_HOST: "host.docker.internal:21"
      AXLE_FTP_USER: ftpuser
      AXLE_FTP_PASS: ftppass
      AXLE_FTP_DIR: /axle
      AXLE_FTP_INTERVAL_SEC: "5"

      ANPR_MINIO_ENDPOINT: "host.docker.internal:9000"
      ANPR_MINIO_ACCESS_KEY: minioadmin
      ANPR_MINIO_SECRET_KEY: minioadmin123
      ANPR_MINIO_BUCKET: anpr
      ANPR_MINIO_USE_SSL: "false"

      AXLE_MINIO_ENDPOINT: "host.docker.internal:9000"
      AXLE_MINIO_ACCESS_KEY: minioadmin
      AXLE_MINIO_SECRET_KEY: minioadmin123
      AXLE_MINIO_BUCKET: axle
      AXLE_MINIO_USE_SSL: "false"

      ATTACHMENT_MINIO_ENDPOINT: "host.docker.internal:9000"
      ATTACHMENT_MINIO_ACCESS_KEY: minioadmin
      ATTACHMENT_MINIO_SECRET_KEY: minioadmin123
      ATTACHMENT_MINIO_BUCKET: attachment
      ATTACHMENT_MINIO_USE_SSL: "false"

      DIMENSION_ENABLED: "true"
      RTSP_URL: rtsp://admin:admin@192.168.1.18:554/live.sdp
      WEIGHING_TRIGGER_URL: "http://host.docker.internal:25000/ws/wim/anpr-capture"
      WEIGHING_TRIGGER_DUMMY: "true"
      CCTV_TRIGGER_URL: "http://host.docker.internal:26090/record"
      CCTV_TRIGGER_DUMMY: "true"
    ports:
      - target: 4000
        published: 24000
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
