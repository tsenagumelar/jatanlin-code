version: "3.8"

services:
  hasura:
    image: hasura/graphql-engine:latest
    container_name: hasura-jwt
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://jatanlin:SuperSecretPasswordBang123@postgres-jatanlin:5432/jatanlin
      HASURA_GRAPHQL_ADMIN_SECRET: devhasurasecret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"jatanlin-super-secret-jwt-key-2026"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
      HASURA_GRAPHQL_SERVER_PORT: "8080"
    networks:
      - postgres_net

networks:
  postgres_net:
    external: true
    name: postgres_default
