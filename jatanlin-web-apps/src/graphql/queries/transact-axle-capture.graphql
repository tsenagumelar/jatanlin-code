# Query: Get All Axle Captures (dengan filter is_deleted = false)
query GetAxleCaptures(
  $limit: Int!
  $offset: Int!
  $where: transact_axle_capture_bool_exp = {}
) {
  transact_axle_capture(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
    limit: $limit
    offset: $offset
    order_by: { captured_at: desc }
  ) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    length_mm
    total_wheels
    total_axles
    vehicle_category
    vehicle_body_type
    minio_bucket
    minio_date_folder
    minio_xml_object
    minio_image_object
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
  }

  transact_axle_capture_aggregate(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
  ) {
    aggregate {
      count
    }
  }
}

# Query: Get Axle Capture By ID
query GetAxleCaptureById($id: uuid!) {
  transact_axle_capture_by_pk(id: $id) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    length_mm
    total_wheels
    total_axles
    vehicle_category
    vehicle_body_type
    minio_bucket
    minio_date_folder
    minio_xml_object
    minio_image_object
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
  }
}

# Query: Get Axle Captures By Plate Number
query GetAxleCapturesByPlate($plate_no: String!, $limit: Int = 10) {
  transact_axle_capture(
    where: { plate_no: { _ilike: $plate_no }, is_deleted: { _eq: false } }
    limit: $limit
    order_by: { captured_at: desc }
  ) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    total_axles
    vehicle_category
    vehicle_body_type
    minio_image_object
  }
}

# Query: Get Axle Captures By Date Range
query GetAxleCapturesByDateRange(
  $start_date: timestamptz!
  $end_date: timestamptz!
) {
  transact_axle_capture(
    where: {
      captured_at: { _gte: $start_date, _lte: $end_date }
      is_deleted: { _eq: false }
    }
    order_by: { captured_at: desc }
  ) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    total_axles
    vehicle_category
  }
}

# Mutation: Insert Axle Capture
mutation InsertAxleCapture($object: transact_axle_capture_insert_input!) {
  insert_transact_axle_capture_one(object: $object) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    total_axles
    vehicle_category
    created_date
    session_id
  }
}

# Mutation: Update Axle Capture
mutation UpdateAxleCapture($id: uuid!, $set: transact_axle_capture_set_input!) {
  update_transact_axle_capture_by_pk(pk_columns: { id: $id }, _set: $set) {
    id
    external_id
    plate_no
    captured_at
    total_axles
    updated_by
    updated_date
  }
}

# Mutation: Soft Delete Axle Capture
mutation SoftDeleteAxleCapture($id: uuid!, $updated_by: uuid!) {
  update_transact_axle_capture_by_pk(
    pk_columns: { id: $id }
    _set: {
      is_deleted: true
      is_active: false
      updated_by: $updated_by
      updated_date: "now()"
    }
  ) {
    id
    external_id
    plate_no
    is_deleted
    is_active
    updated_by
    updated_date
  }
}

# Subscription: Listen for New Axle Captures
subscription SubscribeLatestAxleCapture($session_id: uuid!, $site_id: uuid) {
  transact_axle_capture(
    where: {
      is_deleted: { _eq: false }
      session_id: { _eq: $session_id }
      site_id: { _eq: $site_id }
    }
    order_by: [{ updated_date: desc_nulls_last }, { created_date: desc }]
    limit: 1
  ) {
    id
    external_id
    plate_no
    captured_at
    camera_id
    length_mm
    total_wheels
    total_axles
    vehicle_category
    vehicle_body_type
    minio_bucket
    minio_date_folder
    minio_image_object
    updated_date
    site_id
    created_date
  }
}
