# Query: Get All Weighings (dengan filter is_deleted = false)
query GetWeighings(
  $limit: Int!
  $offset: Int!
  $where: transact_weighing_bool_exp = {}
) {
  transact_weighing(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
    limit: $limit
    offset: $offset
    order_by: [{ updated_date: desc_nulls_last }, { created_date: desc }]
  ) {
    id
    total_axle
    axle_detail
    total_weight
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
    site_id
  }

  transact_weighing_aggregate(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
  ) {
    aggregate {
      count
    }
  }
}

# Query: Get Weighing By ID
query GetWeighingById($id: uuid!) {
  transact_weighing_by_pk(id: $id) {
    id
    total_axle
    axle_detail
    total_weight
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
    site_id
    session_id
  }
}

# Query: Get Weighings By Site
query GetWeighingsBySite($site_id: uuid!, $limit: Int = 10) {
  transact_weighing(
    where: { site_id: { _eq: $site_id }, is_deleted: { _eq: false } }
    limit: $limit
    order_by: { created_date: desc }
  ) {
    id
    total_axle
    axle_detail
    total_weight
    created_date
    site_id
  }
}

# Query: Get Weighings By Date Range
query GetWeighingsByDateRange(
  $start_date: timestamptz!
  $end_date: timestamptz!
) {
  transact_weighing(
    where: {
      created_date: { _gte: $start_date, _lte: $end_date }
      is_deleted: { _eq: false }
    }
    order_by: { created_date: desc }
  ) {
    id
    total_axle
    axle_detail
    total_weight
    created_date
    site_id
  }
}

# Mutation: Insert Weighing
mutation InsertWeighing($object: transact_weighing_insert_input!) {
  insert_transact_weighing_one(object: $object) {
    id
    total_axle
    axle_detail
    total_weight
    created_date
    site_id
  }
}

# Mutation: Update Weighing
mutation UpdateWeighing($id: uuid!, $set: transact_weighing_set_input!) {
  update_transact_weighing_by_pk(pk_columns: { id: $id }, _set: $set) {
    id
    total_axle
    axle_detail
    total_weight
    updated_by
    updated_date
  }
}

# Mutation: Soft Delete Weighing
mutation SoftDeleteWeighing($id: uuid!, $updated_by: uuid!) {
  update_transact_weighing_by_pk(
    pk_columns: { id: $id }
    _set: {
      is_deleted: true
      is_active: false
      updated_by: $updated_by
      updated_date: "now()"
    }
  ) {
    id
    is_deleted
    is_active
    updated_by
    updated_date
  }
}

# Subscription: Listen for New Weighings
subscription SubscribeLatestWeighing($session_id: uuid!, $site_id: uuid) {
  transact_weighing(
    where: {
      is_deleted: { _eq: false }
      session_id: { _eq: $session_id }
      site_id: { _eq: $site_id }
    }
    order_by: { created_date: desc }
    limit: 1
  ) {
    id
    total_axle
    axle_detail
    total_weight
    is_active
    created_date
    updated_date
    site_id
  }
}
