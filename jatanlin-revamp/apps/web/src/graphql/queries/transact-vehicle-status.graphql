# Query: Get Vehicle Status By Date Range
query GetVehicleStatusByDateRange(
  $start_date: timestamptz!
  $end_date: timestamptz!
) {
  transact_vehicle_status(
    where: {
      created_date: { _gte: $start_date, _lte: $end_date }
      is_deleted: { _eq: false }
    }
    order_by: { created_date: desc }
  ) {
    ...VehicleStatusDetails
  }
}

# Query: Get Vehicle Status Statistics by Status Type
query GetVehicleStatusStatistics($site_id: uuid) {
  # Count by status
  detected: transact_vehicle_status_aggregate(
    where: {
      status: { _eq: "detected" }
      is_deleted: { _eq: false }
      site_id: { _eq: $site_id }
    }
  ) {
    aggregate {
      count
    }
  }

  verified: transact_vehicle_status_aggregate(
    where: {
      status: { _eq: "verified" }
      is_deleted: { _eq: false }
      site_id: { _eq: $site_id }
    }
  ) {
    aggregate {
      count
    }
  }

  odol: transact_vehicle_status_aggregate(
    where: {
      status: { _eq: "odol" }
      is_deleted: { _eq: false }
      site_id: { _eq: $site_id }
    }
  ) {
    aggregate {
      count
    }
  }

  normal: transact_vehicle_status_aggregate(
    where: {
      status: { _eq: "normal" }
      is_deleted: { _eq: false }
      site_id: { _eq: $site_id }
    }
  ) {
    aggregate {
      count
    }
  }

  rejected: transact_vehicle_status_aggregate(
    where: {
      status: { _eq: "rejected" }
      is_deleted: { _eq: false }
      site_id: { _eq: $site_id }
    }
  ) {
    aggregate {
      count
    }
  }
}

# Mutation: Insert Vehicle Status
mutation InsertVehicleStatus($object: transact_vehicle_status_insert_input!) {
  insert_transact_vehicle_status_one(object: $object) {
    ...VehicleStatusDetails
  }
}

# Mutation: Insert Multiple Vehicle Status
mutation InsertVehicleStatusBatch(
  $objects: [transact_vehicle_status_insert_input!]!
) {
  insert_transact_vehicle_status(objects: $objects) {
    affected_rows
    returning {
      ...VehicleStatusDetails
    }
  }
}

# Mutation: Update Vehicle Status
mutation UpdateVehicleStatus(
  $id: uuid!
  $set: transact_vehicle_status_set_input!
) {
  update_transact_vehicle_status_by_pk(pk_columns: { id: $id }, _set: $set) {
    ...VehicleStatusDetails
  }
}

# Mutation: Update Vehicle Status by Vehicle Actual ID
mutation UpdateVehicleStatusByActualId(
  $transact_vehicle_actual_id: uuid!
  $set: transact_vehicle_status_set_input!
) {
  update_transact_vehicle_status(
    where: { transact_vehicle_actual_id: { _eq: $transact_vehicle_actual_id } }
    _set: $set
  ) {
    affected_rows
    returning {
      ...VehicleStatusDetails
    }
  }
}

# Mutation: Soft Delete Vehicle Status
mutation SoftDeleteVehicleStatus($id: uuid!, $updated_by: uuid!) {
  update_transact_vehicle_status_by_pk(
    pk_columns: { id: $id }
    _set: {
      is_deleted: true
      is_active: false
      updated_by: $updated_by
      updated_date: "now()"
    }
  ) {
    id
    transact_vehicle_actual_id
    status
    result
    is_deleted
    is_active
    updated_by
    updated_date
  }
}

# Mutation: Hard Delete Vehicle Status (permanent)
mutation DeleteVehicleStatus($id: uuid!) {
  delete_transact_vehicle_status_by_pk(id: $id) {
    id
    transact_vehicle_actual_id
    status
  }
}

# Subscription: Listen for New Vehicle Status
subscription SubscribeLatestVehicleStatus($site_id: uuid) {
  transact_vehicle_status(
    where: { is_deleted: { _eq: false }, site_id: { _eq: $site_id } }
    order_by: { created_date: desc }
    limit: 1
  ) {
    ...VehicleStatusDetails
  }
}

