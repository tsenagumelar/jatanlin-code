# Fragment: Vehicle Status with relations
fragment VehicleStatusDetails on transact_vehicle_status {
  id
  transact_vehicle_actual_id
  status
  result
  notes
  attachment
  is_active
  is_deleted
  created_by
  created_date
  updated_by
  updated_date
  site_id

  # Vehicle Actual Data with all nested relations
  transact_vehicle_actual {
    id
    anpr_id
    axle_id
    transact_dimension_id
    transact_weighing_id
    actual_width
    actual_length
    actual_height
    actual_weight
    site_id

    # ANPR Data
    transact_anpr_capture {
      id
      external_id
      plate_no
      confidence
      captured_at
      location_code
      camera_id
      minio_bucket
      minio_date_folder
      minio_full_image_object
      minio_plate_image_object
    }

    # Axle Data
    transact_axle_capture {
      id
      external_id
      plate_no
      captured_at
      camera_id
      length_mm
      total_wheels
      total_axles
      vehicle_category
      vehicle_body_type
      minio_bucket
      minio_date_folder
      minio_image_object
    }

    # Weighing Data
    transact_weighing {
      id
      total_axle
      axle_detail
      total_weight
      is_active
      created_date
    }

    # Dimension Data
    transact_dimension {
      id
      anpr_id
      filepath
      length
      width
      height
      is_active
      created_date
    }
  }
}

# Query: Get All Vehicle Status (dengan filter is_deleted = false)
query GetVehicleStatus(
  $limit: Int!
  $offset: Int!
  $where: transact_vehicle_status_bool_exp = {}
) {
  transact_vehicle_status(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
    limit: $limit
    offset: $offset
    order_by: { created_date: desc }
  ) {
    ...VehicleStatusDetails
  }

  transact_vehicle_status_aggregate(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
  ) {
    aggregate {
      count
    }
  }
}

# Query: Get Vehicle Status By ID
query GetVehicleStatusById($id: uuid!) {
  transact_vehicle_status_by_pk(id: $id) {
    ...VehicleStatusDetails
  }
}

# Query: Get Vehicle Status By Vehicle Actual ID
query GetVehicleStatusByActualId($transact_vehicle_actual_id: uuid!) {
  transact_vehicle_status(
    where: {
      transact_vehicle_actual_id: { _eq: $transact_vehicle_actual_id }
      is_deleted: { _eq: false }
    }
    order_by: { created_date: desc }
  ) {
    ...VehicleStatusDetails
  }
}

