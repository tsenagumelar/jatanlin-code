events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  client_max_body_size 100m;

  upstream site_web {
    server 192.168.65.254:3000;
  }

  upstream site_api {
    server 192.168.65.254:4000;
  }

  upstream site_hasura {
    server hasura:8080;
  }

  upstream site_minio {
    server minio:9000;
  }

  upstream site_minio_console {
    server minio:9001;
  }

  upstream dc_web {
    server 192.168.65.254:3001;
  }

  upstream dc_api {
    server 192.168.65.254:28001;
  }

  upstream dc_hasura {
    server 192.168.65.254:28080;
  }

  upstream dc_minio {
    server 192.168.65.254:29000;
  }

  upstream dc_minio_console {
    server 192.168.65.254:29001;
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  server {
    listen 80;
    server_name site.jatanlin.test site.jatanlin.local;

    location / {
      proxy_pass http://site_web;
    }
  }

  server {
    listen 80;
    server_name api.site.jatanlin.test api.site.jatanlin.local;

    location / {
      proxy_pass http://site_api;
    }
  }

  server {
    listen 80;
    server_name hasura.site.jatanlin.test hasura.site.jatanlin.local;

    location / {
      proxy_pass http://site_hasura;
    }
  }

  server {
    listen 80;
    server_name minio.site.jatanlin.test minio.site.jatanlin.local;

    location / {
      proxy_set_header Host $http_host;
      proxy_pass http://site_minio;
    }
  }

  server {
    listen 80;
    server_name console.minio.site.jatanlin.test console.minio.site.jatanlin.local;

    location / {
      proxy_set_header Host $http_host;
      proxy_pass http://site_minio_console;
    }
  }

  server {
    listen 80;
    server_name dc.jatanlin.test dc.jatanlin.local;

    location / {
      proxy_pass http://dc_web;
    }
  }

  server {
    listen 80;
    server_name api.dc.jatanlin.test api.dc.jatanlin.local;

    location / {
      proxy_pass http://dc_api;
    }
  }

  server {
    listen 80;
    server_name hasura.dc.jatanlin.test hasura.dc.jatanlin.local;

    location / {
      proxy_pass http://dc_hasura;
    }
  }

  server {
    listen 80;
    server_name minio.dc.jatanlin.test minio.dc.jatanlin.local;

    location / {
      proxy_set_header Host $http_host;
      proxy_pass http://dc_minio;
    }
  }

  server {
    listen 80;
    server_name console.minio.dc.jatanlin.test console.minio.dc.jatanlin.local;

    location / {
      proxy_set_header Host $http_host;
      proxy_pass http://dc_minio_console;
    }
  }
}
