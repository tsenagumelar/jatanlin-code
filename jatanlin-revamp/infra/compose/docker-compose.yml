services:
  postgres:
    image: postgres:16-alpine
    container_name: jtn-revamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jatanlin}
      POSTGRES_USER: ${POSTGRES_USER:-jatanlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jatanlin_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1
    container_name: jtn-revamp-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin}:${POSTGRES_PASSWORD:-jatanlin_dev_password}@postgres:5432/${POSTGRES_DB:-jatanlin}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-devhasurasecret}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET:-jatanlin-super-secret-jwt-key-2026}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
    ports:
      - "${HASURA_GRAPHQL_PORT:-18080}:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jtn-revamp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: jtn-revamp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/anpr &&
        mc mb --ignore-existing local/axle &&
        mc mb --ignore-existing local/attachment &&
        mc anonymous set download local/anpr &&
        mc anonymous set download local/axle &&
        mc anonymous set download local/attachment
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    restart: "no"

  nats:
    image: nats:2.11-alpine
    container_name: jtn-revamp-nats
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "${NATS_PORT:-14222}:4222"

  redis:
    image: redis:7-alpine
    container_name: jtn-revamp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  ftp-local:
    image: delfer/alpine-ftp-server:latest
    container_name: jtn-revamp-ftp
    restart: unless-stopped
    environment:
      USERS: "${FTP_USER:-ftpuser}|${FTP_PASS:-ftppass}"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "${FTP_PASSIVE_MIN_PORT:-21100}"
      MAX_PORT: "${FTP_PASSIVE_MAX_PORT:-21110}"
    ports:
      - "${FTP_PORT:-10021}:21"
      - "${FTP_PASSIVE_MIN_PORT:-21100}-${FTP_PASSIVE_MAX_PORT:-21110}:${FTP_PASSIVE_MIN_PORT:-21100}-${FTP_PASSIVE_MAX_PORT:-21110}"
    volumes:
      - ../data/ftp:/home/${FTP_USER:-ftpuser}

volumes:
  postgres-data:
  minio-data:
  redis-data:
