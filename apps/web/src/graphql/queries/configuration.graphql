# Query: Get All Configs (dengan filter is_deleted = false)
query GetConfigs(
  $limit: Int!
  $offset: Int!
  $where: master_config_bool_exp = {}
) {
  master_config(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
    limit: $limit
    offset: $offset
    order_by: [{ sort_order: asc }, { created_date: desc }]
  ) {
    id
    code
    config_type
    config_key
    config_value
    description
    sort_order
    parent_code
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
  }

  master_config_aggregate(
    where: { _and: [{ is_deleted: { _eq: false } }, $where] }
  ) {
    aggregate {
      count
    }
  }
}

# Query: Get Config By ID
query GetConfigById($id: uuid!) {
  master_config_by_pk(id: $id) {
    id
    code
    config_type
    config_key
    config_value
    description
    sort_order
    parent_code
    is_active
    is_deleted
    created_by
    created_date
    updated_by
    updated_date
  }
}

# Query: Get Configs By Type
query GetConfigsByType($config_type: String!) {
  master_config(
    where: {
      config_type: { _eq: $config_type }
      is_deleted: { _eq: false }
      is_active: { _eq: true }
    }
    order_by: { sort_order: asc }
  ) {
    id
    code
    config_key
    config_value
    description
    sort_order
    parent_code
  }
}

# Mutation: Insert Config
mutation InsertConfig($object: master_config_insert_input!) {
  insert_master_config_one(object: $object) {
    id
    code
    config_type
    config_key
    config_value
    description
    sort_order
    parent_code
    is_active
    created_by
    created_date
  }
}

# Mutation: Update Config
mutation UpdateConfig($id: uuid!, $set: master_config_set_input!) {
  update_master_config_by_pk(pk_columns: { id: $id }, _set: $set) {
    id
    code
    config_type
    config_key
    config_value
    description
    sort_order
    parent_code
    is_active
    updated_by
    updated_date
  }
}

# Mutation: Soft Delete Config (set is_deleted = true)
mutation SoftDeleteConfig($id: uuid!, $updated_by: uuid!) {
  update_master_config_by_pk(
    pk_columns: { id: $id }
    _set: {
      is_deleted: true
      is_active: false
      updated_by: $updated_by
      updated_date: "now()"
    }
  ) {
    id
    code
    config_key
    is_deleted
    is_active
    updated_by
    updated_date
  }
}

# Mutation: Restore Deleted Config (set is_deleted = false)
mutation RestoreConfig($id: uuid!, $updated_by: uuid!) {
  update_master_config_by_pk(
    pk_columns: { id: $id }
    _set: { is_deleted: false, updated_by: $updated_by, updated_date: "now()" }
  ) {
    id
    code
    config_key
    is_deleted
    updated_by
    updated_date
  }
}

# Query: Check Code Availability
query CheckConfigCodeExists($code: String!) {
  master_config(where: { code: { _eq: $code }, is_deleted: { _eq: false } }) {
    id
    code
  }
}

# Query: Check Config Key Availability
query CheckConfigKeyExists($config_type: String!, $config_key: String!) {
  master_config(
    where: {
      config_type: { _eq: $config_type }
      config_key: { _eq: $config_key }
      is_deleted: { _eq: false }
    }
  ) {
    id
    config_type
    config_key
  }
}
