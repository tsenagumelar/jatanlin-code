services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:28001}
    container_name: jtn-dc-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:28001}
    ports:
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${DATA_CENTER_WEB_PORT:-3001}:3001"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: jtn-dc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jatanlin_data_center}
      POSTGRES_USER: ${POSTGRES_USER:-jatanlin_dc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jatanlin_dc_password}
    expose:
      - "5432"
    ports:
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1
    container_name: jtn-dc-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin_dc}:${POSTGRES_PASSWORD:-jatanlin_dc_password}@postgres:5432/${POSTGRES_DB:-jatanlin_data_center}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-dc_hasura_secret}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET:-jatanlin-data-center-secret-2026}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
    ports:
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${HASURA_GRAPHQL_PORT:-28080}:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jtn-dc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jatanlin_dc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jatanlin_dc_minio_password}
    ports:
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-29000}:9000"
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: jtn-dc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jatanlin_dc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jatanlin_dc_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-jatanlin-data-center-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set dc-minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing dc-minio/$${MINIO_BUCKET};
      mc anonymous set download dc-minio/$${MINIO_BUCKET};
      "
    restart: "no"

  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: jtn-dc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin_dc}:${POSTGRES_PASSWORD:-jatanlin_dc_password}@postgres:5432/${POSTGRES_DB:-jatanlin_data_center}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-jatanlin-data-center-secret-2026}
      SITE_SYNC_KEY: ${SITE_SYNC_KEY:-jatanlin-site-sync-key-2026}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:29000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-jatanlin_dc_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jatanlin_dc_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-jatanlin-data-center-attachments}
      MINIO_USE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      ETLENAS_ENABLED: ${ETLENAS_ENABLED:-false}
      ETLENAS_BASE_URL: ${ETLENAS_BASE_URL:-https://api-etle.polri.go.id}
      ETLENAS_USER_TOKEN: ${ETLENAS_USER_TOKEN:-}
      ETLENAS_PASS_TOKEN: ${ETLENAS_PASS_TOKEN:-}
      ETLENAS_CLIENT_SECRET: ${ETLENAS_CLIENT_SECRET:-}
      ETLENAS_CLIENT_ID: ${ETLENAS_CLIENT_ID:-integrasi}
      ETLENAS_INTERVAL_SEC: ${ETLENAS_INTERVAL_SEC:-30}
      ETLENAS_HTTP_TIMEOUT_SEC: ${ETLENAS_HTTP_TIMEOUT_SEC:-20}
      ETLENAS_VIOLATION_CODE: ${ETLENAS_VIOLATION_CODE:-TM}
      ETLENAS_VIOLATION_NAME: ${ETLENAS_VIOLATION_NAME:-Melanggar Tata Cara Muatan}
      ETLENAS_NRP: ${ETLENAS_NRP:-}
      ETLENAS_SATWIL: ${ETLENAS_SATWIL:-Korlantas}
    ports:
      - "${DATA_CENTER_BIND_HOST:-127.0.0.1}:${DATA_CENTER_API_PORT:-28001}:8080"

volumes:
  postgres-data:
  minio-data:
