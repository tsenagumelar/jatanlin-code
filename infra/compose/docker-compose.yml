name: jatanlin-revamp

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HASURA_URL: ${NEXT_PUBLIC_HASURA_URL:-http://localhost:18080/v1/graphql}
        NEXT_PUBLIC_HASURA_WS: ${NEXT_PUBLIC_HASURA_WS:-ws://localhost:18080/v1/graphql}
        NEXT_PUBLIC_HASURA_WS_IP: ${NEXT_PUBLIC_HASURA_WS_IP:-ws://localhost:18080/v1/graphql}
        NEXT_PUBLIC_HASURA_SECRET: ${NEXT_PUBLIC_HASURA_SECRET:-devhasurasecret}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_ID: ${NEXT_PUBLIC_SITE_ID:-628f033e-49b2-4ba0-b1e8-12af4b3895ee}
        NEXT_PUBLIC_SITE_CODE: ${NEXT_PUBLIC_SITE_CODE:-MST-25-00001}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Mampang Revamp Local}
        NEXT_PUBLIC_SITE_LOCATION: ${NEXT_PUBLIC_SITE_LOCATION:-Central Office}
        NEXT_PUBLIC_SITE_REGION: ${NEXT_PUBLIC_SITE_REGION:-Default}
        NEXT_PUBLIC_SITE_TIMEZONE: ${NEXT_PUBLIC_SITE_TIMEZONE:-Asia/Jakarta}
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-http://localhost:19000}
        NEXT_PUBLIC_DEVICE_CHECK_PROD_MODE: ${NEXT_PUBLIC_DEVICE_CHECK_PROD_MODE:-false}
        NEXT_PUBLIC_DEVICE_CHECK_TIMEOUT_MS: ${NEXT_PUBLIC_DEVICE_CHECK_TIMEOUT_MS:-3000}
        NEXT_PUBLIC_ANPR_IP: ${NEXT_PUBLIC_ANPR_IP:-localhost}
        NEXT_PUBLIC_AXLE_IP: ${NEXT_PUBLIC_AXLE_IP:-localhost}
        NEXT_PUBLIC_WIM_IP: ${NEXT_PUBLIC_WIM_IP:-localhost}
        WIM_AGENT_STREAM_URL: ${DOCKER_WIM_AGENT_STREAM_URL:-http://wb-agent:5001/ws/wim/live}
    image: jtn-revamp-web
    container_name: jtn-revamp-web
    restart: unless-stopped
    extra_hosts: &app_extra_hosts
      - "host.docker.internal:host-gateway"
    environment:
      WIM_AGENT_STREAM_URL: ${DOCKER_WIM_AGENT_STREAM_URL:-http://wb-agent:5001/ws/wim/live}
      NEXT_PUBLIC_HASURA_URL: ${NEXT_PUBLIC_HASURA_URL:-http://localhost:18080/v1/graphql}
      NEXT_PUBLIC_HASURA_WS: ${NEXT_PUBLIC_HASURA_WS:-ws://localhost:18080/v1/graphql}
      NEXT_PUBLIC_HASURA_WS_IP: ${NEXT_PUBLIC_HASURA_WS_IP:-ws://localhost:18080/v1/graphql}
      NEXT_PUBLIC_HASURA_SECRET: ${NEXT_PUBLIC_HASURA_SECRET:-devhasurasecret}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_SITE_TIMEZONE: ${NEXT_PUBLIC_SITE_TIMEZONE:-Asia/Jakarta}
      NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-http://localhost:19000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend-api
      - wb-agent

  backend-api: &backend_service
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    image: jatanlin-revamp-backend:local
    container_name: jtn-revamp-backend-api
    restart: unless-stopped
    extra_hosts: *app_extra_hosts
    environment: &backend_environment
      SERVICE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin}:${POSTGRES_PASSWORD:-jatanlin_dev_password}@postgres:5432/${POSTGRES_DB:-jatanlin}?sslmode=disable
      API_PORT: ${API_PORT:-4000}
      API_BODY_LIMIT_MB: ${API_BODY_LIMIT_MB:-50}
      JWT_SECRET: ${JWT_SECRET:-jatanlin-super-secret-jwt-key-2026}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SITE_CODE: ${SITE_CODE:-MST-25-00001}
      SITE_ID: ${SITE_ID:-628f033e-49b2-4ba0-b1e8-12af4b3895ee}
      SITE_NAME: ${SITE_NAME:-Mampang Revamp Local}
      SITE_LOCATION: ${SITE_LOCATION:-Central Office}
      SITE_REGION: ${SITE_REGION:-Default}
      NATS_URL: nats://nats:4222
      ANPR_FTP_HOST: ${DOCKER_ANPR_FTP_HOST:-ftp-local:21}
      ANPR_FTP_USER: ${FTP_USER:-ftpuser}
      ANPR_FTP_PASS: ${FTP_PASS:-ftppass}
      ANPR_FTP_DIR: ${ANPR_FTP_DIR:-anpr}
      ANPR_FTP_INTERVAL_SEC: ${ANPR_FTP_INTERVAL_SEC:-5}
      ANPR_MINIO_ENDPOINT: minio:9000
      ANPR_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      ANPR_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      ANPR_MINIO_BUCKET: ${ANPR_MINIO_BUCKET:-anpr}
      ANPR_MINIO_USE_SSL: "false"
      AXLE_FTP_HOST: ${DOCKER_AXLE_FTP_HOST:-ftp-local:21}
      AXLE_FTP_USER: ${FTP_USER:-ftpuser}
      AXLE_FTP_PASS: ${FTP_PASS:-ftppass}
      AXLE_FTP_DIR: ${AXLE_FTP_DIR:-axle}
      AXLE_FTP_INTERVAL_SEC: ${AXLE_FTP_INTERVAL_SEC:-5}
      AXLE_MINIO_ENDPOINT: minio:9000
      AXLE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      AXLE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      AXLE_MINIO_BUCKET: ${AXLE_MINIO_BUCKET:-axle}
      AXLE_MINIO_USE_SSL: "false"
      ATTACHMENT_MINIO_ENDPOINT: minio:9000
      ATTACHMENT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      ATTACHMENT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      ATTACHMENT_MINIO_BUCKET: ${ATTACHMENT_MINIO_BUCKET:-attachment}
      ATTACHMENT_MINIO_USE_SSL: "false"
      DATA_CENTER_SYNC_ENABLED: ${DATA_CENTER_SYNC_ENABLED:-false}
      DATA_CENTER_API_URL: ${DATA_CENTER_API_URL:-http://host.docker.internal:28001}
      DATA_CENTER_SYNC_KEY: ${DATA_CENTER_SYNC_KEY:-jatanlin-site-sync-key-2026}
      DATA_CENTER_SYNC_INTERVAL_SEC: ${DATA_CENTER_SYNC_INTERVAL_SEC:-30}
      DATA_CENTER_SYNC_BATCH_SIZE: ${DATA_CENTER_SYNC_BATCH_SIZE:-100}
      DATA_CENTER_SYNC_CURSOR_FILE: ${DATA_CENTER_SYNC_CURSOR_FILE:-./data/sync-agent-cursors.json}
      DATA_CENTER_SYNC_HTTP_TIMEOUT_SEC: ${DATA_CENTER_SYNC_HTTP_TIMEOUT_SEC:-20}
      DATA_CENTER_SYNC_LOOKBACK_SEC: ${DATA_CENTER_SYNC_LOOKBACK_SEC:-300}
      DATA_CENTER_SYNC_ONCE: ${DATA_CENTER_SYNC_ONCE:-false}
      DATA_CENTER_ATTACHMENT_SYNC_ENABLED: ${DATA_CENTER_ATTACHMENT_SYNC_ENABLED:-true}
      DATA_CENTER_MINIO_ENDPOINT: ${DATA_CENTER_MINIO_ENDPOINT:-host.docker.internal:29000}
      DATA_CENTER_MINIO_ACCESS_KEY: ${DATA_CENTER_MINIO_ACCESS_KEY:-jatanlin_dc_minio}
      DATA_CENTER_MINIO_SECRET_KEY: ${DATA_CENTER_MINIO_SECRET_KEY:-jatanlin_dc_minio_password}
      DATA_CENTER_MINIO_BUCKET: ${DATA_CENTER_MINIO_BUCKET:-jatanlin-data-center-attachments}
      DATA_CENTER_MINIO_USE_SSL: ${DATA_CENTER_MINIO_USE_SSL:-true}
      WEIGHING_TRIGGER_URL: ${DOCKER_WEIGHING_TRIGGER_URL:-http://wb-agent:5001/ws/wim/anpr-capture}
      WEIGHING_TRIGGER_DIRECTION: ${WEIGHING_TRIGGER_DIRECTION:-RIGHT}
      WEIGHING_TRIGGER_TIMEOUT_SECONDS: ${WEIGHING_TRIGGER_TIMEOUT_SECONDS:-60}
      WEIGHING_TRIGGER_SAVE: ${WEIGHING_TRIGGER_SAVE:-true}
      WEIGHING_TRIGGER_DUMMY: ${WEIGHING_TRIGGER_DUMMY:-false}
      CCTV_TRIGGER_ENABLED: ${CCTV_TRIGGER_ENABLED:-true}
      CCTV_TRIGGER_URL: ${DOCKER_CCTV_TRIGGER_URL:-http://cctv-streamer:8090/record}
      CCTV_TRIGGER_SECONDS: ${CCTV_TRIGGER_SECONDS:-30}
      CCTV_TRIGGER_DUMMY: ${CCTV_TRIGGER_DUMMY:-false}
      CCTV_MODE: ${CCTV_MODE:-rtsp}
      CCTV_RTSP_URL: ${CCTV_RTSP_URL:-}
      RTSP_URL: ${RTSP_URL:-${CCTV_RTSP_URL:-}}
      CCTV_OUTPUT_DIR: ${CCTV_OUTPUT_DIR:-./data/cctv}
      CCTV_RECORD_SECONDS: ${CCTV_RECORD_SECONDS:-30}
      CCTV_SESSION_RECORD_SECONDS: ${CCTV_SESSION_RECORD_SECONDS:-30}
      CCTV_DUMMY_ENABLED: ${CCTV_DUMMY_ENABLED:-true}
      CCTV_HTTP_PORT: ${CCTV_HTTP_PORT:-8090}
      VEAM_LICENSE_PATH: ${VEAM_LICENSE_PATH:-./data/license.veam}
      VEAM_PUBLIC_KEY_B64: ${VEAM_PUBLIC_KEY_B64:-2CKPRGxWNdr2ZT1Q1vOwp2cZqh4MxYmFsOlFtx83eW4=}
      VEAM_HARDWARE_ID: ${VEAM_HARDWARE_ID:-}
      VEAM_USB_SCAN_PATHS: ${VEAM_USB_SCAN_PATHS:-/host/windows,/host/usb,/host/media,/host/run-media,/host/mnt,/mnt,/host/Volumes,/Volumes}
      VEAM_LOGIN_USB_CHECK_ENABLED: ${VEAM_LOGIN_USB_CHECK_ENABLED:-true}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - backend-data:/app/data
      - ${VEAM_USB_HOST_MOUNT:-/run/desktop/mnt/host}:${VEAM_USB_CONTAINER_MOUNT:-/host/windows}:ro
      - /Volumes:/host/Volumes:ro
    depends_on: &backend_depends_on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_started
      ftp-local:
        condition: service_started

  anpr-watcher:
    <<: *backend_service
    image: jatanlin-revamp-anpr-watcher:local
    container_name: jtn-revamp-anpr-watcher
    ports: []
    environment:
      <<: *backend_environment
      SERVICE: anpr-watcher

  axle-watcher:
    <<: *backend_service
    image: jatanlin-revamp-axle-watcher:local
    container_name: jtn-revamp-axle-watcher
    ports: []
    environment:
      <<: *backend_environment
      SERVICE: axle-watcher

  cctv-streamer:
    <<: *backend_service
    image: jatanlin-revamp-cctv-streamer:local
    container_name: jtn-revamp-cctv-streamer
    ports:
      - "${CCTV_HTTP_PORT:-8090}:${CCTV_HTTP_PORT:-8090}"
    environment:
      <<: *backend_environment
      SERVICE: cctv-streamer

  sync-agent:
    <<: *backend_service
    image: jatanlin-revamp-sync-agent:local
    container_name: jtn-revamp-sync-agent
    ports: []
    environment:
      <<: *backend_environment
      SERVICE: sync-agent
      DATA_CENTER_API_URL: ${DOCKER_DATA_CENTER_API_URL:-http://host.docker.internal:28001}
      DATA_CENTER_MINIO_ENDPOINT: ${DOCKER_DATA_CENTER_MINIO_ENDPOINT:-host.docker.internal:29000}
      DATA_CENTER_MINIO_USE_SSL: ${DOCKER_DATA_CENTER_MINIO_USE_SSL:-false}
      DATA_CENTER_SYNC_ENABLED: ${DOCKER_DATA_CENTER_SYNC_ENABLED:-true}

  wb-agent:
    build:
      context: ../../services/wb-agent
      dockerfile: Dockerfile
    container_name: jtn-revamp-wb-agent
    restart: unless-stopped
    extra_hosts: *app_extra_hosts
    environment:
      ASPNETCORE_URLS: http://+:5001
      DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin}:${POSTGRES_PASSWORD:-jatanlin_dev_password}@postgres:5432/${POSTGRES_DB:-jatanlin}?sslmode=disable
      NATS_URL: nats://nats:4222
      SITE_CODE: ${SITE_CODE:-MST-25-00001}
      SITE_ID: ${SITE_ID:-628f033e-49b2-4ba0-b1e8-12af4b3895ee}
      SITE_NAME: ${SITE_NAME:-Mampang Revamp Local}
      SITE_LOCATION: ${SITE_LOCATION:-Central Office}
      SITE_REGION: ${SITE_REGION:-Default}
      WB_SITE_CODE: ${WB_SITE_CODE:-MST-25-00001}
      WB_SITE_ID: ${WB_SITE_ID:-628f033e-49b2-4ba0-b1e8-12af4b3895ee}
      WB_SESSION_LISTENER_ENABLED: ${WB_SESSION_LISTENER_ENABLED:-true}
      WB_SESSION_INTERVAL_SEC: ${WB_SESSION_INTERVAL_SEC:-1}
      WB_CAPTURE_TIMEOUT_SEC: ${WB_CAPTURE_TIMEOUT_SEC:-60}
      WB_CAPTURE_MODE_DELAY_MS: ${WB_CAPTURE_MODE_DELAY_MS:-0}
      WB_CAPTURE_DIRECTION: ${WB_CAPTURE_DIRECTION:-RIGHT}
      WB_LOCATION_CODE: ${WB_LOCATION_CODE:-GATE-A1}
    ports:
      - "${WB_AGENT_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  edge-proxy:
    image: nginx:1.27-alpine
    container_name: jtn-edge-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hasura
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: jtn-revamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jatanlin}
      POSTGRES_USER: ${POSTGRES_USER:-jatanlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jatanlin_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hasura:
    image: hasura/graphql-engine:v2.45.1
    container_name: jtn-revamp-hasura
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-jatanlin}:${POSTGRES_PASSWORD:-jatanlin_dev_password}@postgres:5432/${POSTGRES_DB:-jatanlin}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-devhasurasecret}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_SECRET:-jatanlin-super-secret-jwt-key-2026}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
    ports:
      - "${HASURA_GRAPHQL_PORT:-18080}:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jtn-revamp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: jtn-revamp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/anpr &&
        mc mb --ignore-existing local/axle &&
        mc mb --ignore-existing local/attachment &&
        mc anonymous set download local/anpr &&
        mc anonymous set download local/axle &&
        mc anonymous set download local/attachment
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    restart: "no"

  nats:
    image: nats:2.11-alpine
    container_name: jtn-revamp-nats
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "${NATS_PORT:-14222}:4222"

  redis:
    image: redis:7-alpine
    container_name: jtn-revamp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  ftp-local:
    image: delfer/alpine-ftp-server:latest
    container_name: jtn-revamp-ftp
    restart: unless-stopped
    environment:
      USERS: "${FTP_USER:-ftpuser}|${FTP_PASS:-ftppass}"
      ADDRESS: "${DOCKER_FTP_ADDRESS:-ftp-local}"
      MIN_PORT: "${FTP_PASSIVE_MIN_PORT:-21100}"
      MAX_PORT: "${FTP_PASSIVE_MAX_PORT:-21110}"
    ports:
      - "${FTP_PORT:-10021}:21"
      - "${FTP_PASSIVE_MIN_PORT:-21100}-${FTP_PASSIVE_MAX_PORT:-21110}:${FTP_PASSIVE_MIN_PORT:-21100}-${FTP_PASSIVE_MAX_PORT:-21110}"
    volumes:
      - ../data/ftp:/ftp/${FTP_USER:-ftpuser}

volumes:
  postgres-data:
  minio-data:
  redis-data:
  backend-data:
